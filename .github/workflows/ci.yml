name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify no runtime dependencies
        run: |
          node -e "
            const p = require('./package.json');
            const deps = Object.keys(p.dependencies ?? {});
            if (deps.length > 0) {
              console.error('runtime dependencies are not allowed:', deps);
              process.exit(1);
            }
          "
      - name: Run tests
        run: npm test
      - name: Smoke the CLI
        # doctor exits 1 when it reports warnings and 2 for real failures, so the
        # smoke step asserts the contract instead of demanding exit 0.
        run: |
          set +e
          node bin/station.js version

          node bin/station.js doctor --json > doctor.json
          doctor=$?
          echo "doctor exit=$doctor"

          node bin/station.js plan --json > plan.json
          plan=$?
          echo "plan exit=$plan"

          node -e "
            const d = require('./doctor.json');
            if (!Array.isArray(d.checks) || d.checks.length === 0) process.exit(1);
            const p = require('./plan.json');
            if (!Array.isArray(p.actions)) process.exit(1);
          "
          shape=$?

          if [ "$doctor" -gt 1 ] || [ "$plan" -gt 1 ] || [ "$shape" -ne 0 ]; then
            echo "unexpected exit code: doctor=$doctor plan=$plan shape=$shape"
            exit 1
          fi