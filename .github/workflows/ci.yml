name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify no runtime dependencies
        run: node -e "const p=require('./package.json'); const d=Object.keys(p.dependencies??{}); if(d.length){console.error('runtime dependencies are not allowed:',d);process.exit(1)}"
      - name: Run tests
        run: npm test
      - name: Smoke the CLI
        run: |
          node bin/station.js version
          node bin/station.js doctor --json > doctor.json
          node -e "const d=require('./doctor.json'); if(!Array.isArray(d.checks)) process.exit(1)"
          node bin/station.js plan --json > plan.json
          node -e "const p=require('./plan.json'); if(!Array.isArray(p.actions)) process.exit(1)"